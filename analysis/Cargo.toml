[package]
name = "analysis"
version = "0.1.0"
edition = "2024"

[dependencies]
ateam-controls = { path = "../ateam-controls", features = ["std", "serde"] }
nalgebra = "0.34.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "trajectory_sim"
test = false
harness = false

[[bin]]
name = "compute_trajectory"
test = false
harness = false

[[bin]]
name = "compute_state_measurement"
test = false
harness = false